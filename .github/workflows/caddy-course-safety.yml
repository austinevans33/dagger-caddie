name: Caddy and course safety
on:
  push:
    paths:
      - 'playtest/**'
      - 'functions/**'
      - 'tests/**'
      - '.github/workflows/caddy-course-safety.yml'
  pull_request:
    paths:
      - 'playtest/**'
      - 'functions/**'
      - 'tests/**'
      - '.github/workflows/caddy-course-safety.yml'
permissions:
  contents: read
jobs:
  caddy-course-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/caddy-context.js
          node --check playtest/ai-chat.js
          node --check playtest/caddy-course-facts.js
          node --check playtest/active-course-context.js
          node --check playtest/round-environment.js
      - name: Test typed Caddy facts, backend context and course safety
        run: |
          node --test \
            tests/caddy-structured-facts.test.mjs \
            tests/caddy-backend-context.test.mjs \
            tests/caddy-club-baseline.test.mjs \
            tests/caddy-environment-policy.test.mjs \
            tests/caddy-conditions-ui.test.mjs \
            tests/course-scorecard-coverage-cache.test.mjs \
            tests/course-empty-provider-fallback.test.mjs
