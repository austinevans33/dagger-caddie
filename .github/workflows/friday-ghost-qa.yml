name: Friday Ghost QA
on:
  push:
    branches:
      - release/friday-staging-20261106
  pull_request:
    paths:
      - 'house-ghost-*.js'
      - 'playtest/ghost-preview.html'
      - 'playtest/index.html'
      - 'tests/*ghost*.test.mjs'
      - 'tests/friday-money-room-guard.test.mjs'
      - 'tests/friday-room-recovery.test.mjs'
      - 'tests/friday-ledger-settlement.test.mjs'
      - 'ledger-settlement.js'
      - 'bbb-money.js'
      - 'tests/friday-bbb-settlement.test.mjs'
      - 'tests/friday-course-switch.test.mjs'
      - 'course-catalog.js'
      - 'course-identity.js'
      - 'yardage-book.js'
      - 'tests/friday-yardage-book.test.mjs'
      - 'tests/friday-yardage-entry.test.mjs'
      - 'playtest/yardage-preview.html'
      - 'yardage-selection.js'
      - 'round-yardage-transition.js'
      - 'tests/friday-round-yardage-transition.test.mjs'
      - 'tests/friday-yardage-roundtrip.test.mjs'
      - 'tests/friday-release-entrypoints.test.mjs'
      - 'round-receipt.js'
      - 'playtest/19th-hole.html'
      - 'tests/friday-round-receipt.test.mjs'
      - 'tests/friday-playable-code-parity.test.mjs'
      - 'tests/friday-game-yardage-roundtrip.test.mjs'
      - 'playtest/bbb-money.js'
      - 'playtest/ledger-settlement.js'
      - 'playtest/room-recovery.js'
      - 'playtest/invitation-qr.js'
      - 'tests/friday-yardage-selection.test.mjs'
      - 'money-room.js'
      - 'invitation-qr.js'
      - 'room-recovery.js'
      - '.github/workflows/friday-ghost-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ghost-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic House Ghost test suite
        run: |
          node --check house-ghost-trail.js
          node --check house-ghost-round.js
          node --check house-ghost-ledger.js
          node --check house-ghost-playback.js
          node --test tests/house-ghost-trail.test.mjs tests/house-ghost-round.test.mjs tests/house-ghost-ledger.test.mjs tests/house-ghost-playback.test.mjs tests/friday-ghost-entry.test.mjs tests/friday-money-room-guard.test.mjs tests/friday-room-recovery.test.mjs tests/friday-ledger-settlement.test.mjs tests/friday-bbb-settlement.test.mjs tests/friday-course-switch.test.mjs tests/friday-yardage-book.test.mjs tests/friday-yardage-entry.test.mjs tests/friday-yardage-selection.test.mjs tests/friday-round-yardage-transition.test.mjs tests/friday-yardage-roundtrip.test.mjs tests/friday-release-entrypoints.test.mjs tests/friday-round-receipt.test.mjs tests/friday-playable-code-parity.test.mjs tests/friday-game-yardage-roundtrip.test.mjs
