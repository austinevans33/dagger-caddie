name: Friday Ghost QA
on:
  push:
    branches:
      - release/friday-staging-20261106
  pull_request:
    paths:
      - 'house-ghost-*.js'
      - 'playtest/ghost-preview.html'
      - 'playtest/index.html'
      - 'tests/*ghost*.test.mjs'
      - 'tests/friday-money-room-guard.test.mjs'
      - 'tests/friday-room-recovery.test.mjs'
      - 'tests/friday-ledger-settlement.test.mjs'
      - 'ledger-settlement.js'
      - 'bbb-money.js'
      - 'tests/friday-bbb-settlement.test.mjs'
      - 'tests/friday-course-switch.test.mjs'
      - 'course-catalog.js'
      - 'course-identity.js'
      - 'yardage-book.js'
      - 'tests/friday-yardage-book.test.mjs'
      - 'tests/friday-yardage-entry.test.mjs'
      - 'playtest/yardage-preview.html'
      - 'yardage-selection.js'
      - 'round-yardage-transition.js'
      - 'tests/friday-round-yardage-transition.test.mjs'
      - 'tests/friday-yardage-roundtrip.test.mjs'
      - 'tests/friday-yardage-navigation.test.mjs'
      - 'playtest/yardage-navigation.js'
      - 'playtest/course-pencil-geometry.js'
      - 'tests/friday-course-pencil-geometry.test.mjs'
      - 'playtest/clubhouse-home.js'
      - 'playtest/yardage-caddy-handoff.js'
      - 'playtest/round-score-snapshot.js'
      - 'tests/friday-round-score-snapshot.test.mjs'
      - 'playtest/yardage-caddy-arrival.js'
      - 'tests/friday-yardage-caddy-handoff.test.mjs'
      - 'tests/friday-release-entrypoints.test.mjs'
      - 'round-receipt.js'
      - 'playtest/19th-hole.html'
      - 'tests/friday-round-receipt.test.mjs'
      - 'tests/friday-playable-code-parity.test.mjs'
      - 'tests/friday-game-yardage-roundtrip.test.mjs'
      - 'playtest/bbb-money.js'
      - 'playtest/ledger-settlement.js'
      - 'playtest/room-recovery.js'
      - 'playtest/invitation-qr.js'
      - 'tests/friday-yardage-selection.test.mjs'
      - 'money-room.js'
      - 'invitation-qr.js'
      - 'room-recovery.js'
      - '.github/workflows/friday-ghost-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ghost-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic House Ghost test suite
        run: |
          node --check house-ghost-trail.js
          node --check house-ghost-round.js
          node --check house-ghost-ledger.js
          node --check house-ghost-playback.js
          node --test tests/house-ghost-trail.test.mjs tests/house-ghost-round.test.mjs tests/house-ghost-ledger.test.mjs tests/house-ghost-playback.test.mjs tests/friday-ghost-entry.test.mjs tests/friday-money-room-guard.test.mjs tests/friday-room-recovery.test.mjs tests/friday-ledger-settlement.test.mjs tests/friday-bbb-settlement.test.mjs tests/friday-course-switch.test.mjs tests/friday-yardage-book.test.mjs tests/friday-yardage-entry.test.mjs tests/friday-yardage-selection.test.mjs tests/friday-round-yardage-transition.test.mjs tests/friday-yardage-roundtrip.test.mjs tests/friday-yardage-navigation.test.mjs tests/friday-course-pencil-geometry.test.mjs tests/friday-yardage-caddy-handoff.test.mjs tests/friday-round-score-snapshot.test.mjs tests/friday-release-entrypoints.test.mjs tests/friday-round-receipt.test.mjs tests/friday-playable-code-parity.test.mjs tests/friday-game-yardage-roundtrip.test.mjs

      - name: Check staging-only deploy helper syntax
        run: bash -n qa/deploy-friday-preview.sh
      - name: Package tested Friday candidate
        if: success()
        run: |
          mkdir -p candidate
          cp -R playtest candidate/playtest
          cp yardage-book.js yardage-selection.js course-weather-context.js course-identity.js round-yardage-transition.js candidate/
          cp house-ghost-trail.js house-ghost-round.js house-ghost-ledger.js house-ghost-playback.js candidate/
          cp round-receipt.js candidate/
          git rev-parse HEAD > candidate/FRIDAY_CHECKED_OUT_SHA.txt
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > candidate/FRIDAY_BRANCH_SHA.txt
          printf '%s\n' "${{ github.event_name }}" > candidate/FRIDAY_BUILD_EVENT.txt
          printf '%s\n' 'PR builds use a GitHub merge commit; BRANCH_SHA identifies the proposed branch, CHECKED_OUT_SHA identifies exact tested bytes.' > candidate/README_SHA.txt
      - name: Validate candidate local assets and module imports
        run: python3 tests/friday-bundle-integrity.py
      - name: Upload verified candidate artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dagger-friday-candidate
          path: candidate/
          retention-days: 14

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve Friday candidate locally
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dagger-http.log 2>&1 &
      - name: Run real-browser Games and Yardage Book acceptance
        run: npx playwright test tests/friday-browser.spec.mjs --project=chromium

      - name: Upload visual smoke snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dagger-friday-visuals
          path: candidate-screenshots/
          retention-days: 14
