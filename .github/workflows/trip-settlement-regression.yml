name: Golf Trip settlement regression
on:
  push:
    branches:
      - feature/trip-settlement-foundation-20261101
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check trip-settlement.js
      - name: Run all Node regression tests
        run: node --test tests/*.test.mjs
