name: Golf Trip settlement regression
on:
  push:
    branches:
      - feature/trip-settlement-foundation-20261101
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for file in trip-*.js multi-game-core.js group-skins.js scorecard-trip-bridge.js skins-action-preview.js yardage-*.js house-ghost-match.js ai-chat.js; do
            node --check "$file" || exit 1
          done
      - name: Run all Node regression tests
        run: node --test tests/*.test.mjs
