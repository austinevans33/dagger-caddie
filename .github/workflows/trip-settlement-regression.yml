name: Golf Trip settlement regression
on:
  push:
    branches:
      - feature/trip-settlement-foundation-20261101
  pull_request:
    paths:
      - 'trip-*.js'
      - 'scorecard-trip-bridge.js'
      - 'tests/trip-*.mjs'
      - 'tests/scorecard-trip-bridge.test.mjs'
      - '.github/workflows/trip-settlement-regression.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for file in trip-*.js multi-game-core.js weekend-*.js money-room.js two-player-action.js skins-trial-ui.js group-skins.js scorecard-trip-bridge.js skins-action-preview.js yardage-*.js house-ghost-match.js ai-chat.js; do
            node --check "$file" || exit 1
          done
      - name: Run all Node regression tests
        run: node --test tests/*.test.mjs

      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps webkit
      - name: Verify the Cup scorecard on a phone viewport
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8769/trip-desk-ui.js -o /dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/trip-practice.spec.mjs --workers=1 --reporter=line
