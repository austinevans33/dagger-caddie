name: Shining Rock course rehearsal
on:
  pull_request:
    paths:
      - 'app/**'
      - 'yardage-preview.html'
      - 'ghost-preview.html'
      - 'qa-scorecard/shining-rock/**'
      - 'scripts/build-shining-rock-book.py'
      - 'scripts/production-bundle.py'
      - 'index.html'
      - 'tests/shining-rock-staging.spec.mjs'
      - 'tests/shining-rock.test.mjs'
      - 'tests/production-root.spec.mjs'
      - '.github/workflows/shining-rock-rehearsal.yml'
permissions:
  contents: read
jobs:
  course-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check shared-service change scope
        id: money_scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- index.html .firebaserc firebase.json firestore.rules functions firebase-config.js app/61f9e9de0a/firebase-config.js app/61f9e9de0a/money-room.js app/61f9e9de0a/ledger-settlement.js app/61f9e9de0a/room-session.js app/61f9e9de0a/room-recovery.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify course and preserved production surfaces
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE" HEAD -- .firebaserc firebase.json firebase-config.js firestore.rules functions manifest.json _config.yml 'dcc-*.png' app/61f9e9de0a/firebase-config.js
          python3 - <<'PYCODE'
          import os, subprocess
          from pathlib import Path
          before=subprocess.check_output(['git','show',os.environ['BASE']+':index.html']).decode()
          after=Path('index.html').read_text()
          start='// DCC STEP 30K-A — HOUSE GHOST MATCH ARCHIVE'
          end='// DCC STEP 26A — MATCH PLAY SCORING FOUNDATION'
          picker='<label for="dccGhostStartHole">Starting hole</label>\n<select id="dccGhostStartHole"></select>\n'
          wager_picker='<div><label for="wStartHole">Starting hole</label><select id="wStartHole"></select></div>\n'
          def outside_gameplay(text):
              assert text.count(picker)<=1 and text.count(wager_picker)<=1, 'Starting-hole controls must be unique'
              text=text.replace(picker, '').replace(wager_picker, '')
              left, rest=text.split(start,1)
              _, right=rest.split(end,1)
              text=left+right
              left, rest=text.split('function wagerMath(game){',1)
              _, right=rest.split("const freshGame=",1)
              return left+right
          assert outside_gameplay(before)==outside_gameplay(after), 'Unexpected root markup or code outside Ghost and local wagers'
          PYCODE
          git fetch origin 61f9e9de0a3a7950ce28f223541cdd12f897b5d8
          git fetch origin d9bc012add5d3ffddf292eb19351d3a49130c77c
          git fetch origin 8701933596c6abc0f7861e182a0214e8c187966b
          git fetch origin 227f400e0c358c6abda06f70fa5efa17b6e712dd
          git fetch origin daa3da1216430076328afc918686e6ee3b64c0e0
          git fetch origin 00b6fa3f70f12d2164df630cf1b87ccb417e6ee7
          git fetch origin 1ccf78e8e8be9ba3082849cfb7e279f9b6087a77
          python3 scripts/production-bundle.py --check .
          python3 scripts/build-shining-rock-book.py --check
          node --test tests/*.test.mjs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Prepare the candidate browser and local Pages server
        id: browser_setup
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium webkit
          mkdir -p "$RUNNER_TEMP/public"
          ln -s "$GITHUB_WORKSPACE/_site" "$RUNNER_TEMP/public/dagger-caddie"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/public" &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8766/dagger-caddie/manifest.json -o /dev/null; then break; fi
            sleep 1
          done
      - name: Test production-shaped Pages output at iPhone width
        run: |
          npx playwright test tests/production-root.spec.mjs --browser=chromium --workers=2 --reporter=line --output=test-results/chromium
          npx playwright test tests/production-root.spec.mjs --browser=webkit --workers=2 --reporter=line --output=test-results/webkit
      - name: Package exact rehearsal after acceptance
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$CANDIDATE_HEAD" > "$RUNNER_TEMP/REHEARSAL_HEAD.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/REHEARSAL_TESTED_MERGE.txt"
          tar -czf "$RUNNER_TEMP/shining-rock-rehearsal.tar.gz" -C _site .
      - uses: actions/upload-artifact@v4
        with:
          name: shining-rock-pages-rehearsal
          path: |
            ${{ runner.temp }}/REHEARSAL_HEAD.txt
            ${{ runner.temp }}/REHEARSAL_TESTED_MERGE.txt
            ${{ runner.temp }}/shining-rock-rehearsal.tar.gz
      - name: Test existing Money Room against staging
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' && steps.money_scope.outputs.changed == 'true' }}
        run: npx playwright test tests/shining-rock-staging.spec.mjs --browser=chromium --workers=1 --reporter=line --output=test-results/staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shining-rock-browser-evidence
          path: test-results/
          retention-days: 14
